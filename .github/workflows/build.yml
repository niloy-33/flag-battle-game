name: Build Flag Battle Game APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create the Android project files
        run: |
          mkdir -p .
          cat > settings.gradle <<'HTMLEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FlagBattleGame"
          include ':app'
          HTMLEOF
          mkdir -p .
          cat > build.gradle <<'HTMLEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          HTMLEOF
          mkdir -p .
          cat > gradle.properties <<'HTMLEOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          HTMLEOF
          mkdir -p app
          cat > app/build.gradle <<'HTMLEOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.flagbattle.game'
              compileSdk 34
              defaultConfig {
                  applicationId "com.flagbattle.game"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          HTMLEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'HTMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Flag Battle Game"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          HTMLEOF
          mkdir -p app/src/main/java/com/flagbattle/game
          cat > app/src/main/java/com/flagbattle/game/MainActivity.java <<'HTMLEOF'
          package com.flagbattle.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Keep the screen on the whole time the app is open
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setBackgroundColor(0xFF0E1424);
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onPause() {
                  web.onPause();
                  super.onPause();
              }
          }
          HTMLEOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'HTMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1B2340" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M34,28h6v52h-6z"/>
              <path android:fillColor="#E5484D" android:pathData="M40,30h36l-8,12l8,12h-36z"/>
          </vector>
          HTMLEOF
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Flag Battle</title>
